<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; script-src 'self' https://www.gstatic.com https://apis.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://appleid.apple.com; form-action 'self'; base-uri 'self'">
    <link rel="stylesheet" href="./style1.css">
    <link rel="shortcut icon" href="./src/iconLogin.png" type="image/x-icon">
    <title>Login | Aroma Café</title>
</head>
<body data-tipo="cliente">

    <div class="container-pai">

        <section class="login-principal">
            <div class="card">

                <p class="nome-empresa">Aroma café</p>

                <h2 class="titulo">
                    <span class="titulo-">Entre</span>
                    e encontre seu
                    <span class="titulo-">café</span>
                </h2>

                <p class="texto-">Escolha uma opção para entrar</p>

                <form class="input-principal" novalidate>

                    <label class="input-texto" for="email">E-mail</label>
                    <input type="email" id="email" name="email" class="input-"
                           placeholder="exemplo@email.com.br"
                           autocomplete="username" maxlength="254">

                    <label class="input-texto" for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" class="input-"
                           placeholder="senha"
                           autocomplete="current-password" maxlength="128">

                    <div class="checkbox">
                        <input type="checkbox" id="conectado" class="input-check">
                        <label class="label-conectado" for="conectado">Manter-me conectado</label>
                    </div>

                    <button type="submit" class="botao-entrar">Entrar</button>

                </form>

                <div class="outras-opcoes">
                    <div class="linha"></div>
                    <p>ou continue com</p>
                    <div class="linha"></div>
                </div>

                <div class="outras-opcoes-apps">
                    <a href="#" id="btn-google" class="botoes-1" aria-label="Entrar com Google">
                        <img src="./src/google-icon (1).png" alt="" class="img-icons">
                    </a>
                    <a href="#" id="btn-apple" class="botoes-2" aria-label="Entrar com Apple">
                        <img src="./src/apple-icon (1).png" alt="" class="img-icons2">
                    </a>
                </div>

                <p class="botao-texto">
                    Não tem conta?
                    <a href="../cadastro/cadastro.html" class="link">Cadastre-se</a>
                </p>

                <p>
                    <a href="../esqueceuSenha/senha.html" class="link">Esqueceu a senha?</a>
                </p>

                <p class="botao-texto espaco-adm">
                    Administrador
                    <a href="./loginADM.html" class="link">Entrar</a>
                </p>

            </div>
        </section>

        <section class="parte-dois">
            <div class="login-dois">
                <img src="./src/fundo.png" alt="Aroma café imagem" class="fundo">
            </div>
        </section>

    </div>

    <script src="./script.js"></script>
    <script type="module" src="./login-social.js"></script>
</body>
</html>
