<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Perfil - Usuário</title>
</head>
<body>

    <!-- Container Principal do Layout -->
    <div class="app-container">

        <!-- Sidebar / Dashboard -->
        <aside class="dashboard">
            <h2> Aroma Café </h2>
            <ul>
                <li> 
                    <img src="./image/home.png" alt="Icone de casa">
                    <a href="../homePage_perfil/indexPerfil.html">Página Principal</a>
                </li>
                <li> 
                    <img src="./image/user.png" alt="Icone de uma Pessoa">
                    <label class="tab" data-tab="personal">Perfil</label>
                </li>
                <li> 
                    <img src="./image/settings.png" alt="Icone de Engrenagem">
                    <label class="tab" data-tab="account">Configurações</label>
                </li>
                <li> 
                    <img src="./image/exit.png" alt="Icone para sair da conta">
                    <label class="botaoSair" id="botaoSair" onclick="sairDaConta()" style="cursor: pointer;">Sair da conta</label>
                </li>
            </ul>
        </aside>

        <!-- Área de Conteúdo Principal -->
        <main class="main-content">

            <!-- Cabeçalho do Perfil -->
            <section class="perfil">
                <div class="info-principais">
                    <div class="foto-container">
                        <img src="./image/user-icon.png" alt="Icone para foto de perfil" class="foto-perfil">
                        <img src="./image/camera.png" alt="Icone para mudar a foto de perfil" class="editar-foto">
                    </div>

                    <div class="dados-usuario">
                        <h2> Nome Completo </h2>
                        <p>exemplo@gmail.com</p>
                        <div class="botoes-usuario">
                            <button class="botao-perfil"> Editar Perfil </button>
                            <button class="botao-senha"> Mudar a Senha </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Seção do Formulário / Tabs -->
            <section class="secao-formulario">
                <div class="formulario">

                    <div class="tabs">
                        <button class="tab active" data-tab="personal">
                            Informações Pessoais
                        </button>
                        <button class="tab" data-tab="account">
                            Configurações
                        </button>
                        <button class="tab" data-tab="security">
                            Segurança
                        </button>
                    </div>

                    <!-- Aba Personal Info -->
                    <div class="content active" id="personal">
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Nome</label>
                                <input type="text">
                            </div>

                            <div class="input-group">
                                <label>Sobrenome</label>
                                <input type="text">
                            </div>

                            <div class="input-group">
                                <label>Data de Nascimento</label>
                                <input type="date">
                            </div>

                            <div class="input-group">
                                <label>CPF</label>
                                <input type="text" maxlength="14">
                            </div>

                            <div class="input-group">
                                <label>Número para contato</label>
                                <input type="tel" placeholder="(11) 99999-9999">
                            </div>

                            <div class="input-group">
                                <label>Endereço</label>
                                <input type="text">
                            </div>

                            <div class="input-group">
                                <label>Número</label>
                                <input type="number">
                            </div>

                            <div class="input-group">
                                <label>Complemento</label>
                                <input type="text">
                            </div>

                            <div class="input-group">
                                <label>CEP</label>
                                <input type="text" maxlength="9" placeholder="00000-000">
                            </div>

                            <div class="input-group">
                                <label>Moradia</label>
                                <input type="text" placeholder="Ex: Casa, Apto...">
                            </div>

                            <div class="input-group">
                                <label>Estado</label>
                                <select id="estado">
                                    <option value="">Selecione</option>
                                    <option value="AC">Acre</option>
                                    <option value="AL">Alagoas</option>
                                    <option value="AP">Amapá</option>
                                    <option value="AM">Amazonas</option>
                                    <option value="BA">Bahia</option>
                                    <option value="CE">Ceará</option>
                                    <option value="DF">Distrito Federal</option>
                                    <option value="ES">Espírito Santo</option>
                                    <option value="GO">Goiás</option>
                                    <option value="MA">Maranhão</option>
                                    <option value="MT">Mato Grosso</option>
                                    <option value="MS">Mato Grosso do Sul</option>
                                    <option value="MG">Minas Gerais</option>
                                    <option value="PA">Pará</option>
                                    <option value="PB">Paraíba</option>
                                    <option value="PR">Paraná</option>
                                    <option value="PE">Pernambuco</option>
                                    <option value="PI">Piauí</option>
                                    <option value="RJ">Rio de Janeiro</option>
                                    <option value="RN">Rio Grande do Norte</option>
                                    <option value="RS">Rio Grande do Sul</option>
                                    <option value="RO">Rondônia</option>
                                    <option value="RR">Roraima</option>
                                    <option value="SC">Santa Catarina</option>
                                    <option value="SP">São Paulo</option>
                                    <option value="SE">Sergipe</option>
                                    <option value="TO">Tocantins</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label>Cidade</label>
                                <select id="cidade">
                                    <option value="">Selecione um estado primeiro</option>
                                </select>
                            </div>
                        </div>

                        <div class="textarea-group">
                            <div class="input-group">
                                <label>Descreva seu ambiente:</label>
                                <textarea name="ambiente" id="ambiente" rows="4" placeholder="Faça uma descrição mais detalhada sobre o seu ambiente..."></textarea>
                            </div>
                        </div>

                        <button class="botao-salvar" onclick="abrirModal()">SALVAR</button>
                    </div>

                    <!-- Outras Abas -->
                    <div class="content" id="account">
                        <h2>Account Settings</h2>
                    </div>

                    <div class="content" id="security">
                        <h2>Security</h2>
                    </div>

                    <div class="content" id="preferences">
                        <h2>Preferences</h2>
                    </div>

                </div>
            </section>

        </main>
    </div>

    <!-- Modal Pop-up -->
    <div id="modal" class="modal-overlay">
        <div class="modal-caixa">
            <span class="botaoFechar" onclick="fecharModal()">&times;</span>
            <h2 class="tituloPopup">SALVO!</h2>
            <p class="textoPopup">Suas alterações foram salvas com sucesso.</p>
        </div>
    </div>

    <script src="script.js"></script> 
</body>
</html>
