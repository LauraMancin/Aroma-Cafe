<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styleMenu.css">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Perfil</title>
</head>
<body>
    <section class="dashboard">
        <h2> Aroma Café </h2>
        <ul>
            <li> <img src="./image/home.png" alt="Icone de casa"> Página Principal </li>
            <li> <img src="./image/user.png" alt="Icone de uma Pessoa">Perfil </li>
            <li> <img src="./image/bell.png" alt="Icone de Sino">Notificações  
            </li>
            <li> <img src="./image/settings.png" alt="Icone de Engrenagem">Configurações </li>
            <li> <img src="./image/exit.png" alt="Icone para sair da conta">Sair da conta </li>
        </ul>
    </section>

    <section class="perfil">
        <div class="info-principais">
            <img src="./image/user-icon.png" alt="Icone para foto de perfil" class="foto-perfil">
            <img src="./image/camera.png" alt="Icone para mudar a foto de perfil" class="editar-perfil">

            <h2> Nome Completo </h2>
            <p> exemplo@gmail.com</p>

            <button class="botao-perfil"> Editar Perfil </button>
            <button class="botao-senha"> Mudar a Senha </button>
        </div>
    </section>

    <section class="formulario">
        <div class="info-pessoais">
            <form action="formulario">
                <label for=""> Nome </label>
                <input type="text">
                <label for=""> Sobrenome </label>
                <input type="text">
            </form>
        </div>
    </section>



    
</body>
</html>
