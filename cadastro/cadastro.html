<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Faça seu Cadastro</title>
</head>
<body>
    <div class="container-pai">
        <section class="login-principal">
            <div class="card">

                <p class="nome-empresa">Aroma café</p>

                <h2 class="titulo"><span class="titulo-">Cadastre-se</span> e encontre seu <span class="titulo-">café</span></h2>

                <form class="input-principal">
                    <label class="input-texto">E-mail</label>
                    <input type="email" placeholder="exemplo@email.com.br" class="input-">

                    <label class="input-texto">Confirmar e-mail</label>
                    <input type="email" placeholder="confirmar e-mail" class="input-">

                    <label class="input-texto">Senha</label>
                    <input type="password" placeholder="senha"
                    class="input-">

                    <label class="input-texto">Confirmar senha</label>
                    <input type="password" placeholder="confirmar senha"
                    class="input-">

                    <label class="input-texto">Data de nascimento</label>
                    <input type="date" placeholder="data de nascimento"
                    class="input-">

                    <label class="input-texto">Telefone</label>
                    <input class="input-" type="tel" placeholder="(19) 99999-9999">

                    <label class="input-check">
                    <input type="checkbox" class="check">Eu li e aceito os termos de privacidade.
                    </label>
                </form> 
                    <a href="../login/login.html">
                        <button class="botao-entrar">Cadastre-se</button>
                    </a>

                    <p class="botao-texto">Tem conta? <a href="../login/login.html" class="link">Entre</a></p>

            </div>
        </section>


        <section class="parte-dois">
            
            <div class="login-dois">
                <img src="../login/src/fundo.png" alt="Aroma café imagem" class="fundo">
            </div>

        </section>

    </div>

    <script>
        localStorage.setItem('usuarioLogado', 'true');
    </script>

</body>
</html>
