<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Perfil</title>
</head>
<body>
    <section class="dashboard">
        <h2> Aroma Café </h2>
        <ul>
            <li> <img src="./image/home.png" alt="Icone de casa"> Página Principal </li>
            <li> <img src="./image/user.png" alt="Icone de uma Pessoa">Perfil </li>
            <li> <img src="./image/bell.png" alt="Icone de Sino">Notificações  
            </li>
            <li> <img src="./image/settings.png" alt="Icone de Engrenagem">Configurações </li>
            <li> <img src="./image/exit.png" alt="Icone para sair da conta">Sair da conta </li>
        </ul>
    </section>

    <section class="perfil">
        <div class="info-principais">
            <img src="./image/user-icon.png" alt="Icone para foto de perfil" class="foto-perfil">
            <img src="./image/camera.png" alt="Icone para mudar a foto de perfil" class="editar-perfil">

            <h2> Nome Completo </h2>
            <p> exemplo@gmail.com</p>

            <button class="botao-perfil"> Editar Perfil </button>
            <button class="botao-senha"> Mudar a Senha </button>
        </div>
    </section>

    <section>
        <div class="formulario">

        <div class="tabs">
            <button class="tab active" data-tab="personal">
                Informações Pessoais
            </button>

            <button class="tab" data-tab="account">
                Configurações
            </button>

            <button class="tab" data-tab="security">
                Segurança
            </button>

            <button class="tab" data-tab="preferences">
                Preferências
            </button>
        
        </div>

        <!-- Aba Personal Info -->
        <div class="content active" id="personal">
            <div class="form-row">
                <div class="input-group">
                    <label>Nome</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>Sobrenome</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>Data de Nascimento</label>
                    <input type="date" placeholder="DD/MM/AAAA">
                </div>

                <div class="input-group">
                    <label>CPF</label>
                    <input type="text" maxlength="12">
                </div>

            </div>
        </div>

        <!-- Aba Account Settings -->
        <div class="content" id="account">
            <h2>Account Settings</h2>
        </div>

        <!-- Aba Security -->
        <div class="content" id="security">
            <h2>Security</h2>
        </div>

        <!-- Aba Preferences -->
        <div class="content" id="preferences">
            <h2>Preferences</h2>
        </div>

    </div>
</section>


<script src="script.js"></script>    
</body>
</html>
