<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style1.css">
    <link rel="shortcut icon" href="./src/iconLogin.png" type="image/x-icon">
    <title>Faça seu Login</title>
</head>
<body>
    <div class="container-pai">
        <section class="login-principal">
            <div class="card">

                <p class="nome-empresa">Aroma café</p>

                <h2 class="titulo">Bem-Vindo<span class="titulo-"> de volta</span></h2>

                <p class="texto-">Entrar</p>

                <form class="input-principal">
                    <label class="input-texto">E-mail</label>
                    <input type="email" placeholder="exemplo@email.com.br" class="input-">

                    <label class="input-texto">Senha</label>
                    <input type="password" placeholder="senha"
                    class="input-">

                    <div class="checkbox">
                        <input type="checkbox" class="input-check">
                        <label class="label-conectado">Manter-me conectado</label>
                    </div>

                </form>

                    <a href="../perfilADM/perfilADM.html">
                        <button class="botao-entrar">Entrar</button>
                    </a>

                    <p><a href="../esqueceuSenha/senha.html" class="link">Esqueceu a senha?</a></p>
                    
                    
            </div>
        </section>


        <section class="parte-dois">
            
            <div class="login-dois">
                <img src="./src/fundo.png" alt="Aroma café imagem" class="fundo">
            </div>

        </section>

    </div>

    <script>
        localStorage.setItem('usuarioLogado', 'true');
    </script>

</body>
</html>
