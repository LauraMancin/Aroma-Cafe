<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Login</title>
</head>
<body>
    <section class="login-principal">
        <div class="card">

            <p class="nome-empresa">Aroma café</p>

            <h2 class="titulo"><span class="titulo-">Entre</span> e encontre seu <span class="titulo-">café</span></h2>

            <p class="texto-">Escolha uma opção para entrar</p>

            <form class="input-principal">
                <input type="email" placeholder="exemplo@email.com.br" class="input-">

                <input type="password" placeholder="senha"
                class="input-">
            </form>

            <div class="outras-opcoes">
                <p>ou continue com </p> <div class="linha"></div>
            </div>

            <div class="outras-opcoes-apps">
                <button><img src="../login/src/google-icon (1).png" alt="google"></button>

                <button><img src="../login/src/apple-icon (1).png" alt="apple"></button>

            </div>


                <button>Entrar</button>
                <p>Não tem conta? Cadastre-se</p>
        </div>

    </section>
</body>
</html>
