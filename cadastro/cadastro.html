<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Cadastro</title>
</head>
<body>
    <div class="container-pai">
        <section class="cadastro-principal">
            <div class="card">

                <p class="nome-empresa">Aroma café</p>

                <h2 class="titulo"><span class="titulo-">Cadastre-se</span> e encontre seu <span class="titulo-">café</span></h2>

                <p class="texto-">Escolha uma opção para cadastrar</p>

                <form class="input-principal">
                    <input class="input-" type="email" placeholder="exemplo@email.com.br">

                    <input class="input-" type="email" placeholder="confirmar email">

                    <input class="input-" type="password" placeholder="senha">

                    <input class="input-" type="password" placeholder="confirmar senha">

                    <input class="input-" type="tel" placeholder="(19) 99999-9999">
                </form>

                <div class="outras-opcoes">
                    <p>ou cadastre-se com </p> <div class="linha"></div>
                </div>

                <div class="outras-opcoes-apps">
                    <a href="#">
                        <button class="botoes-1">
                            <img src="./assets/google-icon (1).png" alt="google" class="img-icons">
                        </button>
                    </a>

                    <a href="#">
                        <button class="botoes-2">
                            <img src="./assets/apple-icon (1).png" alt="apple" class="img-icons2">
                        </button>
                    </a>
                </div>

                    <button class="botao">Fazer Cadastro</button>

                    <input class="termosUso" type="checkbox"> <p class="termosUso">Aceito os termos de uso</p>
            </div>
        </section>


        <section class="parte-dois">
            <div class="login-dois">
                <img src="./assets/fundoCadastro.png" alt="Aroma café imagem" class="fundo">
            </div>

        </section>

    </div>

</body>
</html>
