<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Entre no Aroma Café!</title>
</head>
<body>
    <section class="login">
            <div class="textos"> 
                <h2 class="titulo">Entre e encontre seu café</h2>
                <p class="sub-titulo">Escolha uma opção para entrar</p>

                <div class="inputs">
                    <input type="email" placeholder="exemplo@email.com.br">
                    <input type="password" placeholder="digite sua senha">
                </div>    

                <div class="outros-apps">
                    <p>ou continue com</p>

                    <button class="google-botao"><img src="./src/google-icon.png" alt="google"></button>
                    
                    <button><img src="./src/apple-icon.png" alt="apple"></button>
                </div>
            
                <div class="parte-botoes">
                    <button class="botao-entrar">Entrar</button>
                    <p>Não tem conta? <a href="#">Cadastre-se</a></p>
                </div>    
            </div>
    </section>

    <section class="foto-cafeteria">
        <img src="#" alt="plano de fundo">
    </section>

</body>
</html>
